<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Mastery — Academia Interativa de Mestres</title>
  <style>
    :root {
      --bg-surface: #080a0f;
      --bg-surface-elevated: #0e121a;
      --bg-card: rgba(18, 22, 32, 0.78);
      --bg-card-hover: rgba(28, 34, 48, 0.7);
      --bg-inner: rgba(10, 13, 20, 0.65);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-emerald: rgba(16, 185, 129, 0.45);
      --accent-emerald: #10b981;
      --accent-emerald-light: #6ee7b7;
      --accent-amber: #f59e0b;
      --accent-sky: #0ea5e9;
      --accent-rose: #f43f5e;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #151926 0%, #080a0f 60%, #040507 100%);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* CUSTOM SCROLLBARS */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

    .app-shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

    /* HEADER */
    .top-bar {
      height: 60px;
      padding: 0 18px;
      background: rgba(11, 14, 22, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 50;
    }
    .brand-group { display: flex; align-items: center; gap: 14px; }
    .brand-btn {
      display: flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(24, 27, 38, 0.9));
      border: 1px solid var(--border-emerald);
      padding: 6px 14px; border-radius: 14px; color: #fff; cursor: pointer; text-align: left;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }
    .brand-btn:hover { border-color: rgba(16, 185, 129, 0.7); transform: translateY(-1px); }
    .brand-icon { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; }
    .brand-title { font-size: 13.5px; font-weight: 800; letter-spacing: -0.01em; }
    .brand-sub { font-size: 10px; color: var(--accent-emerald-light); font-weight: 600; }

    /* TOP CENTER VIEW SWITCHER */
    .view-switcher {
      display: flex;
      background: rgba(20, 24, 35, 0.85);
      border: 1px solid var(--border-subtle);
      padding: 4px; border-radius: 14px;
      gap: 4px;
    }
    .view-tab {
      padding: 6px 14px; border-radius: 10px; border: none; background: transparent;
      color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 7px; transition: all 0.18s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .view-tab:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .view-tab.active {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #040808; font-weight: 800;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
    }
    .tab-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 99px;
      background: rgba(0, 0, 0, 0.25); color: inherit; font-weight: 700;
    }

    /* TOP RIGHT CONTROLS */
    .controls-group { display: flex; align-items: center; gap: 10px; }
    .seg-group {
      display: flex; background: rgba(16, 20, 30, 0.85);
      padding: 3px; border-radius: 11px; border: 1px solid var(--border-subtle); gap: 3px;
    }
    .seg-btn {
      padding: 5px 9px; border-radius: 8px; border: 1px solid transparent; background: transparent;
      color: var(--text-muted); font-size: 11px; font-family: ui-monospace, SFMono-Regular, monospace;
      font-weight: 600; cursor: pointer; transition: all 0.15s ease;
    }
    .seg-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .seg-btn.active {
      background: rgba(16, 185, 129, 0.2); color: var(--accent-emerald-light);
      font-weight: 700; border-color: rgba(16, 185, 129, 0.4);
    }
    .seg-btn.active-amber {
      background: rgba(245, 158, 11, 0.2); color: #fde68a;
      font-weight: 700; border-color: rgba(245, 158, 11, 0.4);
    }
    .seg-btn.active-emerald {
      background: #10b981; color: #040808; font-weight: 800;
    }

    /* MAIN 3-COLUMN WORKSPACE */
    .main-grid {
      flex: 1; min-height: 0;
      display: grid; grid-template-columns: 350px 1fr 430px; gap: 16px; padding: 14px 18px 16px;
    }

    /* LATERAL PANELS (DOUBLE-BEZEL GLASS PANEL) */
    .sidebar-panel, .study-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px; padding: 14px;
      display: flex; flex-direction: column; min-height: 0;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    /* LEFT SIDEBAR: TOP HEADER & SEARCH */
    .sidebar-header {
      display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;
    }
    .sidebar-mode-nav {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      background: rgba(10, 13, 20, 0.7); padding: 4px; border-radius: 14px;
      border: 1px solid var(--border-subtle);
    }
    .sidebar-mode-btn {
      padding: 8px 10px; border-radius: 10px; border: none; background: transparent;
      color: var(--text-muted); font-size: 11.5px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.16s ease;
    }
    .sidebar-mode-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .sidebar-mode-btn.active {
      background: rgba(16, 185, 129, 0.22); color: var(--accent-emerald-light);
      border: 1px solid rgba(16, 185, 129, 0.4); font-weight: 800;
    }
    .sidebar-search-box {
      position: relative; width: 100%;
    }
    .sidebar-search-input {
      width: 100%; padding: 8px 12px 8px 32px; border-radius: 12px;
      background: rgba(10, 13, 20, 0.85); border: 1px solid var(--border-subtle);
      color: #fff; font-size: 12px; outline: none; transition: all 0.2s;
    }
    .sidebar-search-input:focus {
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
    }
    .search-icon-svg {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; color: var(--text-dim); pointer-events: none;
    }

    /* SCROLL CONTAINER FOR SIDEBAR */
    .sidebar-scroll {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px;
    }

    /* BOOK ACCORDION CARD */
    .book-card {
      background: rgba(12, 15, 24, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 16px; overflow: hidden;
      transition: all 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .book-card:hover { border-color: var(--border-medium); }
    .book-card.is-active-book {
      border-color: rgba(16, 185, 129, 0.35);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, rgba(12, 15, 24, 0.85) 100%);
    }

    .book-card-header {
      padding: 12px 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .book-header-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .book-icon-badge {
      width: 32px; height: 32px; border-radius: 10px;
      background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3);
      display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
    }
    .book-meta-text { flex: 1; min-width: 0; }
    .book-title-h3 {
      font-size: 13px; font-weight: 700; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .book-author-p {
      font-size: 11px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
    }
    .book-header-side { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .book-chap-count {
      font-size: 10.5px; font-weight: 700; color: var(--accent-emerald-light);
      background: rgba(16, 185, 129, 0.14); padding: 2px 7px; border-radius: 99px;
    }
    .chevron-arrow {
      font-size: 11px; color: var(--text-muted); transition: transform 0.2s ease;
    }
    .chevron-arrow.open { transform: rotate(180deg); color: var(--accent-emerald-light); }

    /* CHAPTERS LIST INSIDE BOOK */
    .book-chapters-drawer {
      padding: 4px 10px 10px 10px;
      display: flex; flex-direction: column; gap: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .chapter-row-btn {
      width: 100%; text-align: left; padding: 9px 12px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.03); border: 1px solid transparent;
      color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      transition: all 0.15s ease;
    }
    .chapter-row-btn:hover {
      background: rgba(255, 255, 255, 0.07); color: #fff; border-color: rgba(255, 255, 255, 0.1);
    }
    .chapter-row-btn.active {
      background: rgba(16, 185, 129, 0.18); border-color: rgba(16, 185, 129, 0.45);
      color: #fff;
    }
    .chap-row-left { flex: 1; min-width: 0; }
    .chap-row-num {
      font-size: 9.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--accent-emerald-light);
    }
    .chap-row-title {
      font-size: 11.5px; font-weight: 700; color: #fff; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .isolate-tag {
      font-size: 10px; font-weight: 700; color: var(--accent-emerald-light);
      background: rgba(0, 0, 0, 0.3); padding: 3px 7px; border-radius: 6px;
      display: flex; align-items: center; gap: 4px;
    }

    /* ISOLATED CHAPTER VIEW (CORE USER REQUIREMENT) */
    .isolated-chapter-view {
      display: flex; flex-direction: column; height: 100%; gap: 10px; min-height: 0;
    }
    .isolated-back-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .back-to-books-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.05); color: var(--accent-emerald-light);
      font-size: 11.5px; font-weight: 700; cursor: pointer; transition: all 0.15s;
    }
    .back-to-books-btn:hover { background: rgba(16, 185, 129, 0.15); border-color: var(--border-emerald); }
    .breadcrumb-label { font-size: 11px; color: var(--text-dim); }

    .isolated-chapter-hero {
      padding: 14px; border-radius: 16px;
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.22) 0%, rgba(18, 22, 34, 0.95) 100%);
      border: 1px solid rgba(16, 185, 129, 0.35); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .isolated-eyebrow {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
    }
    .isolated-badge {
      font-size: 9.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.08em; padding: 2px 8px; border-radius: 99px;
      background: rgba(16, 185, 129, 0.25); color: var(--accent-emerald-light);
    }
    .isolated-games-count { font-size: 10.5px; color: var(--text-muted); font-family: monospace; }
    .isolated-title { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .isolated-sub { font-size: 11.5px; color: #d4d4d8; line-height: 1.45; }

    .isolated-games-list {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px;
    }
    .game-card {
      width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px;
      background: rgba(10, 13, 20, 0.7); border: 1px solid var(--border-subtle);
      color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      transition: all 0.16s ease;
    }
    .game-card:hover {
      background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.15); color: #fff;
    }
    .game-card.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(12, 15, 24, 0.95));
      border-color: rgba(16, 185, 129, 0.55); color: #fff;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.15);
    }
    .gm-info { flex: 1; min-width: 0; }
    .gm-title { font-size: 12px; font-weight: 700; color: #fff; }
    .gm-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .gm-eco-tag {
      font-size: 10px; font-family: monospace; font-weight: 700; color: var(--accent-emerald-light);
      background: rgba(255, 255, 255, 0.06); padding: 2px 6px; border-radius: 6px; margin-top: 4px; display: inline-block;
    }
    .done-indicator { color: var(--accent-emerald); font-weight: 900; font-size: 14px; }

    /* OPENINGS & DEFENSES REPERTORY VIEW */
    .opening-cat-block {
      background: rgba(12, 15, 24, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 16px; overflow: hidden;
      margin-bottom: 8px;
    }
    .opening-cat-header {
      padding: 11px 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
    }
    .opening-cat-header:hover { background: rgba(255, 255, 255, 0.05); }
    .cat-title-wrap { display: flex; align-items: center; gap: 8px; }
    .cat-icon { font-size: 14px; }
    .cat-label { font-size: 12.5px; font-weight: 700; color: #fff; }
    .cat-count {
      font-size: 10px; font-weight: 700; color: var(--accent-emerald-light);
      background: rgba(16, 185, 129, 0.15); padding: 2px 7px; border-radius: 99px;
    }

    .opening-items-drawer {
      padding: 6px 10px 10px; display: flex; flex-direction: column; gap: 5px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .opening-item-btn {
      width: 100%; text-align: left; padding: 9px 12px; border-radius: 11px;
      background: rgba(10, 13, 20, 0.7); border: 1px solid transparent;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      transition: all 0.15s ease;
    }
    .opening-item-btn:hover {
      background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.12);
    }
    .opening-item-btn.active {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.22), rgba(12, 16, 26, 0.95));
      border-color: rgba(14, 165, 233, 0.55);
      box-shadow: 0 4px 16px rgba(14, 165, 233, 0.15);
    }
    .op-name { font-size: 12px; font-weight: 700; color: #fff; }
    .op-eco {
      font-size: 10px; font-family: monospace; font-weight: 800; color: #7dd3fc;
      background: rgba(14, 165, 233, 0.15); padding: 2px 6px; border-radius: 6px;
    }
    .op-tag { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    /* CENTER BOARD ARENA */
    .board-arena {
      display: flex; flex-direction: column; justify-content: space-between; min-height: 0; align-items: center;
    }
    .player-bar {
      width: 100%; max-width: 540px; padding: 8px 14px; border-radius: 16px;
      background: rgba(20, 24, 35, 0.82); border: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); transition: border-color 0.2s;
    }
    .player-bar.turn-active {
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
    }
    .p-info { display: flex; align-items: center; gap: 10px; }
    .p-color-box {
      width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 11px; font-weight: 800;
    }
    .p-color-box.w { background: #f4f4f5; color: #090d10; box-shadow: 0 2px 6px rgba(255,255,255,0.2); }
    .p-color-box.b { background: #14171f; color: #f4f4f5; border: 1px solid #3f3f46; }
    .p-name { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .turn-pill {
      font-size: 10px; padding: 2px 8px; border-radius: 99px;
      background: rgba(16, 185, 129, 0.2); color: var(--accent-emerald-light); font-weight: 700;
    }
    .p-sub { font-size: 11px; color: var(--text-muted); }
    .mat-adv {
      font-family: monospace; font-size: 11px; font-weight: 800; color: var(--accent-emerald-light);
      background: rgba(255, 255, 255, 0.08); padding: 3px 7px; border-radius: 6px;
    }

    /* BOARD WRAPPER & BEZEL */
    .board-row-wrap { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0; }
    .eval-bar {
      width: 24px; height: min(56vh, 470px); border-radius: 99px; overflow: hidden;
      border: 1px solid var(--border-medium); position: relative; display: flex; flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .eval-black { background: #181b24; transition: height 0.35s ease; }
    .eval-white { background: #f8fafc; transition: height 0.35s ease; }
    .eval-score {
      position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
      font-size: 9px; font-family: monospace; font-weight: 900; color: #090d10;
    }

    .board-bezel {
      padding: 7px; border-radius: 22px;
      background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, rgba(10,13,20,0.95) 100%);
      border: 1px solid var(--border-medium); box-shadow: 0 28px 70px rgba(0,0,0,0.75);
    }
    .board-grid {
      width: min(56vh, 470px); height: min(56vh, 470px);
      display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
      border-radius: 16px; overflow: hidden; position: relative;
    }
    .board-sq { position: relative; display: flex; align-items: center; justify-content: center; }
    .clickable-piece { cursor: pointer; }
    .piece-wrap { width: 85%; height: 85%; z-index: 5; pointer-events: none; }
    .piece-svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.45)); }
    .sq-selected { position: absolute; inset: 0; background: rgba(16, 185, 129, 0.42); pointer-events: none; }
    .sq-hl { position: absolute; inset: 0; pointer-events: none; }
    .sq-hl-emerald { background: rgba(16, 185, 129, 0.45); }
    .sq-hl-rose { background: rgba(244, 63, 94, 0.45); }
    .sq-hl-amber { background: rgba(245, 158, 11, 0.48); }
    .sq-hl-sky { background: rgba(14, 165, 233, 0.45); }
    .sq-check {
      position: absolute; inset: 0;
      background: radial-gradient(circle, rgba(239,68,68,0.9) 0%, transparent 80%);
      pointer-events: none;
    }
    .coord-rank {
      position: absolute; top: 3px; left: 5px; font-size: 10px; font-weight: 800;
      font-family: monospace; pointer-events: none;
    }
    .coord-file {
      position: absolute; bottom: 3px; right: 5px; font-size: 10px; font-weight: 800;
      font-family: monospace; pointer-events: none;
    }
    .legal-dot {
      width: 15px; height: 15px; border-radius: 99px; background: rgba(0,0,0,0.28);
      z-index: 6; pointer-events: none;
    }
    .legal-ring {
      position: absolute; inset: 3px; border-radius: 99px; border: 5px solid rgba(0,0,0,0.3);
      z-index: 6; pointer-events: none;
    }
    .move-badge {
      position: absolute; top: 2px; right: 2px; z-index: 12;
      width: 22px; height: 22px; border-radius: 99px;
      background: #06b6d4; color: #fff; font-size: 10px; font-weight: 900;
      display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .arrows-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

    /* BOARD BOTTOM TOOLBAR */
    .board-toolbar {
      width: 100%; max-width: 540px; padding: 8px 12px; border-radius: 16px;
      background: rgba(20, 24, 35, 0.88); border: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .nav-btns, .tool-btns { display: flex; align-items: center; gap: 6px; }
    .nav-btns button, .tool-btn, .theme-select {
      padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.05); color: #e4e4e7; font-size: 11px; font-weight: 700; cursor: pointer;
      transition: all 0.15s;
    }
    .nav-btns button:hover:not(:disabled), .tool-btn:hover {
      background: rgba(255, 255, 255, 0.1); color: #fff;
    }
    .nav-btns button:disabled { opacity: 0.3; cursor: default; }
    .tool-btn.active-sky {
      background: rgba(14, 165, 233, 0.22); color: #7dd3fc; border-color: rgba(14, 165, 233, 0.5);
    }
    .ply-counter { font-family: monospace; font-size: 12px; font-weight: 800; padding: 0 6px; color: var(--text-muted); }

    /* RIGHT STUDY PANEL */
    .study-panel-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px;
      background: rgba(10, 13, 20, 0.7); padding: 4px; border-radius: 14px;
      border: 1px solid var(--border-subtle);
    }
    .study-tab-btn {
      padding: 8px 10px; border-radius: 10px; border: none; background: transparent;
      color: var(--text-muted); font-size: 11.5px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.16s ease;
    }
    .study-tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .study-tab-btn.active {
      background: rgba(16, 185, 129, 0.2); color: var(--accent-emerald-light);
      border: 1px solid rgba(16, 185, 129, 0.4); font-weight: 800;
    }

    .study-container { display: flex; flex-direction: column; height: 100%; gap: 12px; min-height: 0; }
    .study-scroll-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }

    /* COMMENTARY & ANNOTATIONS CARD */
    .commentary-card {
      padding: 14px; border-radius: 18px;
      background: linear-gradient(145deg, rgba(20, 24, 36, 0.95), rgba(16, 185, 129, 0.08));
      border: 1px solid var(--border-subtle);
    }
    .rosetta-strip {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 8px; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 10px;
    }
    .main-move-pill {
      padding: 4px 10px; border-radius: 8px;
      background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.45);
      color: var(--accent-emerald-light); font-family: monospace; font-weight: 800; font-size: 13px;
    }
    .rosetta-tags { display: flex; gap: 6px; font-family: monospace; font-size: 11px; color: var(--text-muted); }
    .rosetta-tags span { background: rgba(255, 255, 255, 0.05); padding: 3px 7px; border-radius: 6px; }
    .amber-txt { color: #fcd34d; font-weight: 700; }
    .emerald-txt { color: var(--accent-emerald-light); font-weight: 700; }
    .comment-body p { font-size: 13px; line-height: 1.55; color: #f4f4f5; }

    /* OPENING STUDY RICH CARDS */
    .opening-study-hero {
      padding: 14px; border-radius: 16px;
      background: linear-gradient(145deg, rgba(14, 165, 233, 0.22), rgba(18, 22, 34, 0.95));
      border: 1px solid rgba(14, 165, 233, 0.4);
    }
    .op-hero-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .op-hero-title { font-size: 14.5px; font-weight: 800; color: #fff; }
    .op-hero-desc { font-size: 12px; color: #d4d4d8; line-height: 1.5; margin-top: 4px; }

    .strategic-box {
      background: rgba(10, 13, 20, 0.7); border: 1px solid var(--border-subtle);
      border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .strat-title {
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px;
    }
    .strat-list { display: flex; flex-direction: column; gap: 5px; }
    .strat-item { font-size: 12px; color: #d4d4d8; line-height: 1.4; padding-left: 10px; border-left: 2px solid rgba(255, 255, 255, 0.15); }
    .strat-item.w { border-left-color: #f8fafc; }
    .strat-item.b { border-left-color: #38bdf8; }
    .strat-item.pawn { border-left-color: #f59e0b; }
    .strat-item.trap { border-left-color: #f43f5e; color: #fecdd3; }

    .related-game-banner {
      padding: 10px 12px; border-radius: 12px;
      background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(16, 185, 129, 0.35);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .rel-title { font-size: 11.5px; font-weight: 700; color: var(--accent-emerald-light); }
    .rel-sub { font-size: 10.5px; color: #d4d4d8; }
    .rel-btn {
      padding: 5px 10px; border-radius: 8px; border: none;
      background: #10b981; color: #040808; font-size: 11px; font-weight: 800; cursor: pointer;
    }

    /* MOVESHEET TABLE */
    .movesheet-box {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      background: rgba(10, 13, 20, 0.7); border: 1px solid var(--border-subtle);
      border-radius: 16px; overflow: hidden;
    }
    .movesheet-header {
      padding: 8px 12px; border-bottom: 1px solid var(--border-subtle);
      display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); font-weight: 700;
    }
    .movesheet-scroll { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 3px; }
    .move-pair-row { display: grid; grid-template-columns: 42px 1fr 1fr; align-items: center; font-family: monospace; font-size: 12px; }
    .move-num { color: var(--text-dim); padding-left: 6px; }
    .move-btn {
      text-align: left; padding: 5px 8px; border-radius: 7px; border: none; background: transparent;
      color: #e4e4e7; font-family: monospace; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      transition: all 0.12s;
    }
    .move-btn:hover { background: rgba(255, 255, 255, 0.06); }
    .move-btn.annotated { color: var(--accent-emerald-light); font-weight: 700; }
    .move-btn.active { background: #10b981; color: #040808; font-weight: 900; }
    .ann-dot { width: 6px; height: 6px; border-radius: 99px; background: #10b981; }

    /* GUESS MODE STYLES */
    .guess-container { display: flex; flex-direction: column; height: 100%; gap: 12px; min-height: 0; }
    .guess-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border-subtle); }
    .guess-badge { font-size: 12px; font-weight: 800; color: #fcd34d; text-transform: uppercase; }
    .guess-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .guess-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-box {
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-subtle);
      padding: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px;
    }
    .stat-box strong { font-family: monospace; font-size: 15px; color: var(--accent-emerald-light); }
    .guess-challenge-box, .guess-solved-box {
      padding: 18px; border-radius: 16px; background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.35); display: flex; flex-direction: column; gap: 12px;
    }
    .guess-solved-box { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.45); }
    .challenge-turn { font-size: 11.5px; font-weight: 800; color: #fcd34d; text-transform: uppercase; }
    .wrong-alert { padding: 10px; border-radius: 10px; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.35); font-size: 12px; color: #fecdd3; }
    .hint-alert { padding: 10px; border-radius: 10px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.35); font-size: 12px; color: #fef3c7; }
    .guess-actions { display: flex; gap: 8px; }
    .primary-btn { padding: 12px; border-radius: 12px; border: none; background: #10b981; color: #040808; font-weight: 800; font-size: 13px; cursor: pointer; }
    .primary-btn-sm { padding: 6px 12px; border-radius: 8px; border: none; background: #38bdf8; color: #040808; font-weight: 700; font-size: 11px; cursor: pointer; }
  </style>
</head>

  <div id="root"></div>
  <script src="chess-engine.js"></script>
  <script src="books-data.js"></script>
  <script src="openings-data.js"></script>
  <script src="app-bundle.js"></script>
</body>
