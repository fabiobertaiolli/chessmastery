<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Mastery — Estúdio Lúdico & Leitor Interativo de Xadrez</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ==========================================================================
       GOOGLE STITCH DESIGN SYSTEM — PLAYFUL CHESS STUDIO + LIVE BOOK READER
       ========================================================================== */
    :root {
      --canvas-cream: #FFF9ED;
      --surface-card: #FFFFFF;
      --surface-warm: #FBF8F1;
      --border-warm: #E6DEC8;
      --on-surface: #0d1c2e;
      --on-surface-variant: #3e4942;
      --muted: #6e7a72;

      --primary: #006b49;
      --primary-container: #16865E;
      --mint-soft: #E2F6EA;

      --amber-soft: #FEF3C7;
      --amber-border: #FDE68A;
      --amber-vibrant: #F59E0B;
      --amber-ink: #684000;

      --sky-soft: #EFF6FF;
      --sky-border: #BFDBFE;
      --sky-vibrant: #3B82F6;
      --sky-ink: #004395;

      --coral-soft: #FEE2E2;
      --coral-border: #FCA5A5;
      --coral-vibrant: #F87171;
      --coral-ink: #93000a;

      --board-light: #F5E6CE;
      --board-dark: #B58A65;

      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--canvas-cream);
      color: var(--on-surface);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(181, 138, 101, 0.08);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(22, 134, 94, 0.28);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(22, 134, 94, 0.48);
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--canvas-cream);
    }

    /* TOPBAR PLAYFUL CHESS STUDIO */
    .stitch-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 249, 237, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-warm);
      box-shadow: 0 4px 20px rgba(181, 138, 101, 0.08);
    }

    .stitch-header-inner {
      max-width: 1460px;
      margin: 0 auto;
      padding: 0 22px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--primary-container);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 12px rgba(22, 134, 94, 0.28);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .brand-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--on-surface-variant);
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--amber-vibrant);
    }

    /* NAV PILLS (4 TELAS STITCH) */
    .stitch-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-card);
      padding: 5px;
      border-radius: 16px;
      border: 1px solid var(--border-warm);
      box-shadow: 0 2px 10px rgba(181, 138, 101, 0.06);
    }

    .stitch-nav-btn {
      padding: 8px 15px;
      border-radius: 11px;
      border: none;
      background: transparent;
      color: var(--on-surface-variant);
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: all 150ms var(--ease-out);
      white-space: nowrap;
    }

    .stitch-nav-btn:hover {
      background: var(--canvas-cream);
      color: var(--on-surface);
    }

    .stitch-nav-btn.active {
      background: var(--primary-container);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(22, 134, 94, 0.24);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pill-select {
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border-warm);
      background: var(--surface-card);
      font-size: 12px;
      font-weight: 700;
      color: var(--on-surface);
      cursor: pointer;
    }

    .star-badge-btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--amber-soft);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: var(--amber-ink);
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.14);
      transition: transform 150ms var(--ease-out);
    }

    .star-badge-btn:hover {
      transform: scale(1.04);
    }

    .notebook-btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--sky-soft);
      border: 1px solid var(--sky-border);
      color: var(--sky-ink);
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 150ms var(--ease-out);
    }

    .notebook-btn:hover {
      background: #dbeafe;
    }

    .icon-circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--border-warm);
      background: var(--surface-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 150ms var(--ease-out);
    }

    .icon-circle-btn:hover {
      background: var(--mint-soft);
    }

    /* MAIN CONTAINER */
    .stitch-main {
      max-width: 1460px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 22px 32px;
      flex: 1;
    }

    /* CARDS & CONTAINERS */
    .stitch-card {
      background: var(--surface-card);
      border: 1px solid var(--border-warm);
      border-radius: 22px;
      padding: 18px 20px;
      box-shadow: 0 6px 24px rgba(181, 138, 101, 0.08);
    }

    /* CONTEXT BANNER */
    .context-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .breadcrumb-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--on-surface-variant);
      margin-bottom: 4px;
    }

    .lesson-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--on-surface);
      letter-spacing: -0.015em;
      line-height: 1.25;
    }

    /* WORKSPACE 12-COLUMN GRID */
    .studio-grid {
      display: grid;
      grid-template-columns: 7fr 5fr;
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 1060px) {
      .studio-grid {
        grid-template-columns: 1fr;
      }
    }

    /* CHESS.COM INTERACTIVE BOARD & EVAL BAR */
    .board-stage-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
      max-width: 610px;
      width: 100%;
      margin: 0 auto;
    }

    .eval-bar {
      width: 28px;
      border-radius: 14px;
      overflow: hidden;
      background: #233144;
      border: 2px solid var(--border-warm);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 6px 16px rgba(181, 138, 101, 0.12);
    }

    .eval-fill-dark {
      background: #233144;
      transition: height 420ms var(--ease-out);
      width: 100%;
    }

    .eval-fill-light {
      background: #ffffff;
      transition: height 420ms var(--ease-out);
      width: 100%;
    }

    .eval-score-label {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .board-frame {
      background: #ffffff;
      padding: 11px;
      border-radius: 22px;
      border: 1.5px solid var(--border-warm);
      box-shadow: 0 12px 32px rgba(181, 138, 101, 0.15);
      position: relative;
    }

    .board-grid {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.18);
    }

    .board-sq {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transition: background-color 80ms ease;
    }

    .board-sq.playable {
      cursor: grab;
    }
    .board-sq.playable:active {
      cursor: grabbing;
    }
    .board-sq.legal-dest {
      cursor: pointer;
    }

    .sq-coord-rank {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      pointer-events: none;
      opacity: 0.88;
    }

    .sq-coord-file {
      position: absolute;
      bottom: 3px;
      right: 5px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      pointer-events: none;
      opacity: 0.88;
    }

    .piece-wrap {
      width: 85%;
      height: 85%;
      z-index: 10;
      pointer-events: none;
      will-change: transform;
    }

    .legal-dot {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: rgba(22, 134, 94, 0.42);
      pointer-events: none;
      z-index: 15;
    }

    .legal-ring {
      width: 88%;
      height: 88%;
      border-radius: 999px;
      border: 5px solid rgba(22, 134, 94, 0.58);
      pointer-events: none;
      z-index: 15;
    }

    .move-eval-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      z-index: 25;
      width: 23px;
      height: 23px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }

    /* PROMOTION POPOVER (CHESS.COM STYLE) */
    .promo-popover {
      position: absolute;
      z-index: 50;
      background: #ffffff;
      border: 2px solid var(--primary-container);
      border-radius: 14px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 12.5%;
      height: 50%;
    }

    .promo-btn {
      flex: 1;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      transition: background 120ms ease;
    }

    .promo-btn:hover {
      background: var(--mint-soft);
    }

    /* TACTILE CONTROLS DOCK */
    .hint-gold-btn {
      width: 100%;
      height: 48px;
      border-radius: 16px;
      background: var(--amber-soft);
      border: 2px solid rgba(245, 158, 11, 0.45);
      color: var(--amber-ink);
      font-size: 14.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(245, 158, 11, 0.2);
      transition: all 140ms var(--ease-out);
    }

    .hint-gold-btn:hover {
      background: #fde68a;
    }

    .transport-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .tactile-btn {
      height: 42px;
      padding: 0 10px;
      border-radius: 13px;
      border: 1px solid var(--border-warm);
      background: var(--surface-warm);
      color: var(--on-surface);
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: all 130ms var(--ease-out);
    }

    .tactile-btn:hover:not(:disabled) {
      background: var(--mint-soft);
      border-color: var(--primary-container);
    }

    .tactile-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .tactile-btn.primary {
      background: var(--primary-container);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 3px 10px rgba(22, 134, 94, 0.22);
    }

    .tactile-btn.primary:hover:not(:disabled) {
      background: var(--primary);
    }

    .candy-track {
      width: 100%;
      height: 11px;
      border-radius: 999px;
      background: #e6eeff;
      padding: 2px;
      overflow: hidden;
    }

    .candy-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-container) 100%);
      transition: width 300ms var(--ease-out);
    }

    /* LIVE BOOK READER & INLINE CLICKABLE MOVE CHIPS */
    .book-reader-scroll {
      max-height: 560px;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .book-passage-card {
      background: #ffffff;
      border: 1.5px solid var(--border-warm);
      border-radius: 18px;
      padding: 15px 17px;
      transition: all 160ms var(--ease-out);
    }

    .book-passage-card.active {
      background: #FFFBEB;
      border-color: var(--amber-vibrant);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.14);
    }

    .book-passage-card.theory {
      background: var(--surface-warm);
    }

    .passage-moves-ribbon {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(230, 222, 200, 0.7);
    }

    .ribbon-move-btn {
      padding: 4px 10px;
      border-radius: 9px;
      border: 1px solid var(--border-warm);
      background: var(--canvas-cream);
      color: var(--on-surface);
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 130ms var(--ease-out);
    }

    .ribbon-move-btn:hover {
      background: var(--mint-soft);
      border-color: var(--primary-container);
    }

    .ribbon-move-btn.active {
      background: var(--primary-container);
      color: #ffffff;
      border-color: var(--primary);
      transform: scale(1.05);
      box-shadow: 0 2px 8px rgba(22, 134, 94, 0.28);
    }

    .book-paragraph-text {
      font-size: 15px;
      line-height: 1.78;
      color: var(--on-surface);
      font-weight: 500;
      user-select: text;
    }

    /* PÍLULA DE MOVIMENTO CLICÁVEL DENTRO DO PARÁGRAFO */
    .inline-move-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin: 0 2px;
      padding: 1px 8px;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 800;
      line-height: 1.45;
      border: 1px solid rgba(22, 134, 94, 0.3);
      background: var(--mint-soft);
      color: #005237;
      cursor: pointer;
      transition: all 130ms var(--ease-out);
      vertical-align: baseline;
    }

    .inline-move-chip:hover {
      background: var(--primary-container);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .inline-move-chip.active {
      background: var(--primary-container);
      color: #ffffff;
      box-shadow: 0 0 0 3px rgba(22, 134, 94, 0.25);
      transform: scale(1.06);
    }

    .inline-move-chip.variation {
      background: var(--amber-soft);
      border-color: rgba(245, 158, 11, 0.45);
      color: #855300;
    }

    .inline-move-chip.variation:hover,
    .inline-move-chip.variation.active {
      background: var(--amber-vibrant);
      color: #2a1700;
    }

    /* 3 MENTOR CARDS (CORUJA SOFIA, LIVRO MÁGICO, ROBÔ PIPO) */
    .mentor-card {
      border-radius: 22px;
      padding: 16px 18px;
      border: 2px solid transparent;
    }
    .mentor-card.owl {
      background: #FFFBEB;
      border-color: #FDE68A;
    }
    .mentor-card.book {
      background: #F0FDF4;
      border-color: #BBF7D0;
    }
    .mentor-card.robot {
      background: #EFF6FF;
      border-color: #BFDBFE;
    }

    .mentor-avatar {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    /* LIBRARY & CARDS GRID */
    .cards-grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 16px;
    }

    .cards-grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .kpi-grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    /* MODAL NOTEBOOKLM */
    .stitch-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(13, 28, 46, 0.58);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .stitch-modal-panel {
      background: var(--canvas-cream);
      border: 2px solid var(--primary-container);
      border-radius: 26px;
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(13, 28, 46, 0.35);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="./chess-engine.js"></script>
  <script src="./books-data.js"></script>
  <script src="./openings-data.js"></script>
  <script src="./app-bundle.js"></script>
</body>
</html>
