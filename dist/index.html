<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Mastery — Estúdio Clássico & Treinador de Aberturas</title>
  <style>
    /* ==========================================================================
       TASTE-SKILL v2.1 — STYLE & SHELL: FRAMED-SHEET (Light)
       "The app chrome is one tinted L-shaped frame; the work sits on a white sheet
        with a hairline edge and soft corners, so depth comes from a single tone
        step and no shadow."
       ========================================================================== */
    :root {
      /* Tokens oficiais do estilo framed-sheet (library/app.json + assets/app.css) */
      --ground: #f4f6f5;          /* Moldura em L (sidebar + topbar) com leve matiz pedra/sálvia */
      --surface: #ffffff;         /* Folha branca principal e painéis internos */
      --raised: #f4f6f8;          /* Superfície interna preenchida e hover de linhas */
      --active: #e8ecea;          /* Pílula neutra do item ativo na navegação */
      --border: #e6e8ea;          /* Borda de 1px (~1.2:1 sobre branco, nunca pesada) */
      --rule: #f0f1f2;            /* Regras horizontais entre linhas de listas e tabelas */
      --control: #cdced1;         /* Borda de inputs e botões (1 passo mais forte) */
      --text: #131416;            /* Tinta principal */
      --muted: #5a5d60;           /* Texto secundário (contraste >= 4.5:1) */
      --faint: #686b6e;           /* Metadados e placeholders (contraste >= 4.5:1) */

      /* Orçamento de cor <= 3%: 1 matiz principal para dados/seleção */
      --accent: #1b6c80;          /* Teal analítico do framed-sheet (3:1+ sobre branco) */
      --accent-soft: #e6f2f5;
      --primary: #131416;         /* Botão primário em quase-preto tinta */
      --primary-ink: #ffffff;

      /* Polaridade semântica e pílulas tonais (fundo pálido + tinta escura do mesmo matiz) */
      --positive: #1e7b4f;
      --negative: #c4242a;
      --warning: #92400e;
      --pill-positive-bg: #dcfae5;
      --pill-positive-ink: #04250e;
      --pill-negative-bg: #ffedea;
      --pill-negative-ink: #831c1e;
      --pill-warning-bg: #fffbeb;
      --pill-warning-ink: #92400e;
      --pill-neutral-bg: #ebedee;
      --pill-neutral-ink: #353736;
      --pill-info-bg: #e6f2f5;
      --pill-info-ink: #0f4452;

      /* Cores do tabuleiro (único elemento de alta cromia material na folha) */
      --board-light: #f3ead8;
      --board-dark: #b58b63;
      --board-frame: #27231f;

      /* Geometria bimodal do framed-sheet */
      --sheet-inset: 8px;
      --radius-sheet: 16px;
      --radius-card: 8px;
      --radius-control: 6px;

      /* Dimensões estruturais do shell framed-sheet */
      --sidebar-width: 248px;
      --topbar-height: 48px;
      --pad: 24px;
      --gap: 16px;
      --card-pad: 18px;
      --control-height: 32px;
      --row-height: 44px;
      --nav-row: 32px;

      /* Tipografia: IBM Plex Sans + IBM Plex Mono (apenas IDs, ECO e lances) */
      --font: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      --font-mono: "IBM Plex Mono", "SF Mono", "JetBrains Mono", ui-monospace, monospace;
      --fs-title: 22px;
      --fs-section: 16px;
      --fs-kpi: 26px;
      --fs-body: 14px;
      --fs-small: 12px;

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --t-press: 120ms;
      --t-hover: 150ms;
      --t-ui: 200ms;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--ground);
      color: var(--text);
      font: 400 var(--fs-body)/20px var(--font);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .num, .mono, table, .kpi-value, .move-cell, .eco-code {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #d5d8da;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #b8bcc0;
    }

    /* ==========================================================================
       SHELL FRAMED-SHEET:
       Sidebar (248px) e Topbar (48px) compartilham --ground sem linha divisória
       entre eles, formando um L contínuo. A folha branca (.work-sheet) fica
       recuada 8px das bordas direita e inferior com raio de 16px e borda de 1px.
       ========================================================================== */
    .framed-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      grid-template-rows: var(--topbar-height) minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      background: var(--ground);
    }

    /* Canto superior esquerdo da moldura L: Marca do Produto + Escopo */
    .shell-brand {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--ground);
      /* Sem borda entre sidebar e topbar (regra estrita do framed-sheet) */
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-mark svg {
      width: 15px;
      height: 15px;
      stroke-width: 1.75;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .brand-scope {
      font-size: 12px;
      color: var(--muted);
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--active);
      font-family: var(--font-mono);
    }

    /* Barra Superior (48px) sobre o mesmo --ground da moldura L */
    .shell-topbar {
      grid-column: 2;
      grid-row: 1;
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 16px 0 8px;
      background: var(--ground);
    }

    /* Busca centralizada na janela (548x32 com dica de atalho conforme blueprint) */
    .topbar-search-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 32px;
      display: flex;
      align-items: center;
    }

    .topbar-search-wrap svg {
      position: absolute;
      left: 10px;
      width: 14px;
      height: 14px;
      color: var(--muted);
      pointer-events: none;
    }

    .topbar-search {
      width: 100%;
      height: 32px;
      padding: 0 56px 0 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      font-size: 13px;
      color: var(--text);
      transition: border-color var(--t-hover) ease;
    }

    .topbar-search::placeholder {
      color: var(--faint);
    }

    .topbar-search:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-kbd {
      position: absolute;
      right: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--faint);
      background: var(--ground);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      line-height: 1.2;
      pointer-events: none;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Sidebar Esquerda (248px) sobre o mesmo --ground da moldura L */
    .shell-sidebar {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      padding: 8px 12px 14px;
      background: var(--ground);
      overflow: hidden;
    }

    .sidebar-nav-section {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 12px;
    }

    .group-label {
      margin: 10px 8px 4px;
      font-size: var(--fs-small);
      font-weight: 400;
      color: var(--faint);
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      height: var(--nav-row);
      padding: 0 10px;
      border-radius: 8px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      text-align: left;
      transition: background-color var(--t-hover) ease, color var(--t-hover) ease;
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .nav-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke-width: 1.5;
      color: var(--muted);
    }

    .nav-item:hover {
      background: var(--raised);
      color: var(--text);
    }

    .nav-item[aria-current="page"] {
      background: var(--active);
      color: var(--text);
      font-weight: 500;
    }

    .nav-item[aria-current="page"] svg {
      color: var(--text);
    }

    .nav-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .nav-count.urgent {
      background: var(--pill-warning-bg);
      color: var(--pill-warning-ink);
      padding: 1px 6px;
      border-radius: 999px;
      font-weight: 500;
    }

    /* Lista contextual dentro da Sidebar (Acordeão de Livros / Capítulos / Aberturas) */
    .sidebar-catalog {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .sidebar-footer {
      padding-top: 10px;
      margin-top: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }

    /* Acordeão de Livro na Sidebar (sem sombras, 1px border sutil) */
    .book-accordion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
    }

    .book-accordion.active {
      border-color: #c5d4d8;
    }

    .book-header-btn {
      width: 100%;
      padding: 10px 11px;
      background: transparent;
      border: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      cursor: pointer;
      transition: background-color var(--t-hover) ease;
    }

    .book-header-btn:hover {
      background: var(--raised);
    }

    .book-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .book-author {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .book-chapters-list {
      border-top: 1px solid var(--rule);
      padding: 6px;
      background: #fafbfb;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chapter-row-btn {
      width: 100%;
      padding: 7px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: var(--surface);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      transition: background-color var(--t-hover) ease, border-color var(--t-hover) ease;
    }

    .chapter-row-btn:hover {
      background: var(--raised);
      border-color: var(--border);
    }

    .chapter-row-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }

    .chapter-row-sub {
      font-size: 11px;
      color: var(--muted);
    }

    .game-item-btn {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      transition: background-color var(--t-hover) ease, color var(--t-hover) ease;
    }

    .game-item-btn:hover {
      background: var(--raised);
      color: var(--text);
    }

    .game-item-btn.selected {
      background: var(--active);
      color: var(--text);
      font-weight: 500;
    }

    /* ==========================================================================
       A FOLHA BRANCA (.work-sheet):
       Encaixada a 8px das bordas direita e inferior, raio de 16px, borda 1px,
       sem sombra.
       ========================================================================== */
    .work-sheet {
      grid-column: 2;
      grid-row: 2;
      margin: 0 var(--sheet-inset) var(--sheet-inset) 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sheet);
      padding: var(--pad);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    /* Linha de Título da Folha (Title Row conforme app.css) */
    .sheet-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-title-main h1 {
      font-size: var(--fs-title);
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .sheet-finding {
      margin-top: 3px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sheet-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    /* Faixa de KPIs dividida por 1px (sem ícones, valor em 400, label em 500) */
    .kpis {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      flex-shrink: 0;
    }

    .kpi {
      padding: 10px 16px;
    }

    .kpi + .kpi {
      border-left: 1px solid var(--border);
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .kpi-value {
      margin-top: 3px;
      font-size: 20px;
      line-height: 1.15;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .kpi-value small {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
      margin-left: 3px;
    }

    /* Layout interno da folha: Palco do Tabuleiro + Coluna Direita de Orientação */
    .sheet-workspace {
      flex: 1;
      min-height: 0;
      margin-top: 16px;
      display: grid;
      grid-template-columns: minmax(420px, 1.08fr) minmax(380px, 0.92fr);
      gap: var(--gap);
      overflow: hidden;
    }

    /* Painel Padrão (1px border, radius 8px, sem sombra) */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: var(--card-pad);
      min-width: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel-header h2 {
      font-size: var(--fs-section);
      line-height: 1.3;
      font-weight: 600;
      color: var(--text);
    }

    .panel-meta {
      font-size: var(--fs-small);
      color: var(--faint);
    }

    /* Abas do Framed-Sheet: sublinhado de 2px em tinta ou no acento */
    .tabs {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .tab-btn {
      position: relative;
      padding: 8px 0 9px;
      border: 0;
      background: transparent;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      cursor: pointer;
      transition: color var(--t-hover) ease;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn[aria-selected="true"] {
      color: var(--text);
      font-weight: 600;
    }

    .tab-btn[aria-selected="true"]::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--accent);
    }

    /* Controles e Botões (height: 32px, radius: 6px, sem gradiente/sombra) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: var(--control-height);
      padding: 0 12px;
      border-radius: var(--radius-control);
      border: 1px solid var(--control);
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: background-color var(--t-hover) ease, transform var(--t-press) var(--ease-out);
    }

    .btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 1.6;
    }

    .btn:hover:not(:disabled) {
      background: var(--raised);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn.primary {
      background: var(--primary);
      color: var(--primary-ink);
      border-color: transparent;
    }

    .btn.primary:hover:not(:disabled) {
      background: #27292c;
    }

    .btn.accent-outline {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--surface);
    }

    .btn.accent-outline:hover:not(:disabled) {
      background: var(--accent-soft);
    }

    .btn.ghost {
      border-color: transparent;
      background: transparent;
      color: var(--muted);
    }

    .btn.ghost:hover:not(:disabled) {
      background: var(--raised);
      color: var(--text);
    }

    /* Segmented Control (app.css) */
    .segmented {
      display: inline-flex;
      width: max-content;
      max-width: 100%;
      padding: 2px;
      border-radius: 7px;
      background: var(--raised);
      border: 1px solid var(--border);
    }

    .segmented button {
      height: 26px;
      padding: 0 10px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: background-color var(--t-hover) ease, color var(--t-hover) ease;
    }

    .segmented button[aria-pressed="true"] {
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    /* Pílulas semânticas (app.css) */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--pill-neutral-bg);
      color: var(--pill-neutral-ink);
      white-space: nowrap;
    }
    .pill.pos { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
    .pill.neg { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
    .pill.warn { background: var(--pill-warning-bg); color: var(--pill-warning-ink); }
    .pill.info { background: var(--pill-info-bg); color: var(--pill-info-ink); }

    /* ==========================================================================
       PALCO DO TABULEIRO (Coluna Esquerda da Folha)
       ========================================================================== */
    .board-stage-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 14px 16px;
    }

    .board-stage-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .board-center-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 4px 0;
    }

    /* Barra de Avaliação Vertical (Modo Explorador) */
    .eval-bar {
      width: 20px;
      height: min(50vh, 430px);
      background: #232527;
      border: 1px solid var(--control);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .eval-bar-white {
      width: 100%;
      background: #f5f6f7;
      transition: height 280ms var(--ease-out);
    }

    .eval-score-tag {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      line-height: 1;
    }

    /* Tabuleiro de Xadrez Tátil */
    .board-frame {
      padding: 8px;
      background: var(--board-frame);
      border-radius: var(--radius-card);
      border: 1px solid #131416;
    }

    .chess-board {
      width: min(50vh, 430px);
      height: min(50vh, 430px);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      position: relative;
      border-radius: 3px;
      overflow: hidden;
    }

    .chess-square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .chess-piece {
      width: 84%;
      height: 84%;
      pointer-events: none;
      transition: transform 120ms var(--ease-out);
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.22));
    }

    .chess-square:hover .chess-piece {
      transform: translateY(-1px);
    }

    .coord-label {
      position: absolute;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      line-height: 1;
      pointer-events: none;
      opacity: 0.82;
    }

    .legal-dot {
      width: 26%;
      height: 26%;
      border-radius: 50%;
      background: rgba(27, 108, 128, 0.55);
      pointer-events: none;
    }

    .legal-ring {
      position: absolute;
      inset: 5%;
      border-radius: 50%;
      border: 3px solid rgba(27, 108, 128, 0.65);
      pointer-events: none;
    }

    /* Barra de Progresso e Controles Essenciais na base do Tabuleiro */
    .board-stage-bottom {
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-track {
      flex: 1;
      height: 5px;
      background: #dfe2e5;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 220ms var(--ease-out);
    }

    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* ==========================================================================
       COLUNA DIREITA DA FOLHA: ORIENTAÇÃO, FONTES SEPARADAS & PLANILHA
       ========================================================================== */
    .guidance-column {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
      gap: 12px;
    }

    /* Cartões das 3 Fontes Separadas (Tutor, Livro, Stockfish) sem sombra, 1px border */
    .source-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 14px 16px;
    }

    .source-card.tutor {
      border-left: 3px solid #b87d14;
    }

    .source-card.book {
      border-left: 3px solid var(--positive);
    }

    .source-card.engine {
      border-left: 3px solid var(--accent);
    }

    .source-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .source-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .source-body {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
    }

    .source-citation {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--rule);
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Feedback Construtivo de Lance (3 faixas) */
    .feedback-banner {
      border-radius: var(--radius-card);
      padding: 12px 14px;
      border: 1px solid var(--border);
    }
    .feedback-banner.main {
      background: var(--pill-positive-bg);
      color: var(--pill-positive-ink);
      border-color: #a9e5be;
    }
    .feedback-banner.plausible {
      background: var(--pill-info-bg);
      color: var(--pill-info-ink);
      border-color: #b5d8e2;
    }
    .feedback-banner.retry {
      background: var(--pill-warning-bg);
      color: var(--pill-warning-ink);
      border-color: #f3d78b;
    }

    /* Tabelas e Listas (app.css: sem zebra, 12px grey sentence-case headers) */
    table.clean-table {
      width: 100%;
      border-collapse: collapse;
    }
    table.clean-table th {
      height: 32px;
      padding: 0 10px;
      text-align: left;
      font-weight: 400;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    table.clean-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--rule);
      font-size: 13px;
      vertical-align: baseline;
    }
    table.clean-table tr:last-child td {
      border-bottom: 0;
    }
    table.clean-table th.n, table.clean-table td.n {
      text-align: right;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .rows {
      display: grid;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 8px 0;
    }
    .row + .row {
      border-top: 1px solid var(--rule);
    }

    .empty-box {
      display: grid;
      place-items: center;
      min-height: 76px;
      padding: 14px;
      border: 1px dashed var(--control);
      border-radius: var(--radius-control);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    /* Modal Flutuante (único elemento com sombra permitida conforme §9.4) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(19, 20, 22, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      padding: 24px;
    }

    .modal-dialog {
      width: 100%;
      max-width: 660px;
      max-height: 84vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sheet);
      padding: 24px;
      box-shadow: 0 12px 32px rgba(19, 20, 22, 0.14);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="./chess-engine.js"></script>
  <script src="./books-data.js"></script>
  <script src="./openings-data.js"></script>
  <script src="./app-bundle.js"></script>
</body>
</html>
