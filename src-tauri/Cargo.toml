[package]
name = "chess_mastery"
version = "1.0.0"
description = "Chess Mastery — Estudo de Livros Clássicos de Xadrez para macOS"
authors = ["Fabio Bertaiolli"]
edition = "2021"

[lib]
name = "chess_mastery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
